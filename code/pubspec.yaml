name: _learn_dart_with_tests
description: Workspace root for the runnable examples in "Learn Dart with Tests".
publish_to: none

environment:
  sdk: ^3.13.0

# The root package holds tool/ only. It needs the same lint set as every
# study package, or tool/ is analysed under weaker rules than the book's code.
dev_dependencies:
  lints: ^6.0.0

